title: Team Budget
email: alex@alexbevi.com
description: >-
  Team Budget makes hockey team finances simple. Track budgets, payments, and money match checks
  without spreadsheets — built for volunteer treasurers who need clarity fast.
tagline: "For hockey parents by a hockey parent"
baseurl: ""
url: ""
login_url: "http://localhost:3000"
data_dir: config

plugins:
  - jekyll-feed

collections:
  docs:
    output: true
    permalink: /docs/:name/
  articles:
    output: true
    permalink: /articles/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  - scope:
      path: ""
      type: docs
    values:
      layout: docs
  - scope:
      path: ""
      type: articles
    values:
      layout: article
