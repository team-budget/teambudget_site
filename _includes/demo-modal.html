<div class="modal" id="demo-modal" aria-hidden="true">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title">
    <button class="modal-close" type="button" data-modal-close aria-label="Close">x</button>
    <h2 id="demo-modal-title">Request a Demo</h2>
    <p class="muted">Share a few details and we will follow up with a walkthrough.</p>
    <form
      class="contact-form"
      data-demo-form
      data-api-url="{{ site.demo_request_api_url }}"
      novalidate
    >
      <label>
        Name
        <input type="text" name="name" placeholder="Alex Bevilacqua" required />
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="alex@alexbevi.com" required />
      </label>
      <label>
        Details
        <textarea name="details" rows="4" placeholder="Tell us about your team and what you need." required></textarea>
      </label>
      <p class="form-status" data-form-status aria-live="polite"></p>
      <button class="button primary" type="submit" data-submit-button>Send request</button>
    </form>
  </div>
</div>
<script src="{{ '/assets/js/demo-modal.js' | relative_url }}" defer></script>
