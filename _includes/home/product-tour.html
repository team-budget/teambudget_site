<section class="section" id="tour">
  <div class="container">
    <div class="section-heading">
      <h2>Product tour</h2>
      <p class="muted">Focused views for budget, roster, transactions, finances, and audit history.</p>
    </div>
    <div class="tour-grid">
      <div class="tour-card">
        <div class="tour-label">Budget overview</div>
        <button
          class="tour-media"
          type="button"
          data-zoom-image="{{ '/assets/images/ss-budget.png' | relative_url }}"
          data-zoom-caption="Read-only Other and Refunds revenue rows with clear explanations."
          aria-label="Open budget overview screenshot"
        >
          <img
            src="{{ '/assets/images/ss-budget.png' | relative_url }}"
            alt="Budget overview with category totals and revenue rows"
          />
        </button>
      </div>
      <div class="tour-card">
        <div class="tour-label">Roster payments</div>
        <button
          class="tour-media"
          type="button"
          data-zoom-image="{{ '/assets/images/ss-roster.png' | relative_url }}"
          data-zoom-caption="Parent balances plus a dedicated Refunds column."
          aria-label="Open roster payments screenshot"
        >
          <img
            src="{{ '/assets/images/ss-roster.png' | relative_url }}"
            alt="Roster payments view with balances and refunds"
          />
        </button>
      </div>
      <div class="tour-card">
        <div class="tour-label">Team Money Status strip</div>
        <button
          class="tour-media"
          type="button"
          data-zoom-image="{{ '/assets/images/ss-strip.png' | relative_url }}"
          data-zoom-caption="Persistent Expected / Current / Difference with Pin toggle."
          aria-label="Open team money status strip screenshot"
        >
          <img
            src="{{ '/assets/images/ss-strip.png' | relative_url }}"
            alt="Team money status strip with expected current and difference values"
          />
        </button>
      </div>
      <div class="tour-card">
        <div class="tour-label">Finances</div>
        <button
          class="tour-media"
          type="button"
          data-zoom-image="{{ '/assets/images/ss-finances.png' | relative_url }}"
          data-zoom-caption="Bank Balance, Cash on Hand, and Uncashed Cheques cards."
          aria-label="Open finances screenshot"
        >
          <img
            src="{{ '/assets/images/ss-finances.png' | relative_url }}"
            alt="Finances view with bank balance cash on hand and uncashed cheques"
          />
        </button>
      </div>
      <div class="tour-card">
        <div class="tour-label">History</div>
        <button
          class="tour-media"
          type="button"
          data-zoom-image="{{ '/assets/images/ss-history.png' | relative_url }}"
          data-zoom-caption="Action pills and visual before/after field change chips."
          aria-label="Open history screenshot"
        >
          <img
            src="{{ '/assets/images/ss-history.png' | relative_url }}"
            alt="History view with action pills and before after change details"
          />
        </button>
      </div>
    </div>
  </div>
</section>
